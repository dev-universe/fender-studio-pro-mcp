[package]
name = "fender-studio-pro-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Native Rust MCP control server for Fender Studio Pro"
repository = "https://github.com/dev-universe/fender-studio-pro-mcp"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
fs2 = "0.4"
hound = "=3.5.1"
ebur128 = "=0.1.11"
include_dir = "0.7"
libc = "0.2"
quick-xml = "0.41"
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
zip = { version = "6.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "=0.9.2"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = "symbols"

